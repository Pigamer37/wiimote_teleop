controller_manager:
  ros__parameters:
    update_rate: 10  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: position_controllers/JointGroupPositionController

    gripper_controller:
      type: position_controllers/JointGroupPositionController

position_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

gripper_controller:
  ros__parameters:
    joints:
    - j_dg_1_1
    - j_dg_1_2
    - j_dg_1_3
    - j_dg_1_4
    - j_dg_2_1
    - j_dg_2_2
    - j_dg_2_3
    - j_dg_2_4
    - j_dg_3_1
    - j_dg_3_2
    - j_dg_3_3
    - j_dg_3_4
