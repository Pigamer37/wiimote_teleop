/gripper/controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    position_controller:
      type: position_controllers/JointGroupPositionController

/gripper/position_controller:
  ros__parameters:
    joints:
    - j_dg_1_1
    - j_dg_1_2
    - j_dg_1_3
    - j_dg_1_4
    - j_dg_2_1
    - j_dg_2_2
    - j_dg_2_3
    - j_dg_2_4
    - j_dg_3_1
    - j_dg_3_2
    - j_dg_3_3
    - j_dg_3_4
